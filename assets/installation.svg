<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 360" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: transparent; }
      .stroke-main { stroke: #c9d1d9; fill: none; }
      .stroke-dim { stroke: #484f58; fill: none; }
      .fill-main { fill: #c9d1d9; }
      .fill-dim { fill: #8b949e; }
      .text-mono {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        font-size: 10px;
        letter-spacing: 0.35em;
        text-anchor: middle;
      }
      
      @media (prefers-color-scheme: light) {
        .stroke-main { stroke: #24292f; }
        .stroke-dim { stroke: #d0d7de; }
        .fill-main { fill: #24292f; }
        .fill-dim { fill: #57606a; }
      }

      /* Subtle breathing lantern glow */
      @keyframes lanternPulse {
        0%, 100% { opacity: 0.35; r: 6px; }
        50% { opacity: 0.95; r: 8px; }
      }
      .lantern-glow {
        animation: lanternPulse 4s ease-in-out infinite;
        transform-origin: 425px 145px;
      }

      /* Slow water drift */
      @keyframes waterDrift {
        0% { transform: translateX(0px); }
        50% { transform: translateX(12px); }
        100% { transform: translateX(0px); }
      }
      .water-group {
        animation: waterDrift 8s ease-in-out infinite;
      }

      /* Drifting particulate */
      @keyframes floatDust1 {
        0% { transform: translate(0, 0); opacity: 0; }
        30% { opacity: 0.7; }
        70% { opacity: 0.7; }
        100% { transform: translate(-35px, -25px); opacity: 0; }
      }
      @keyframes floatDust2 {
        0% { transform: translate(0, 0); opacity: 0; }
        40% { opacity: 0.5; }
        80% { opacity: 0.5; }
        100% { transform: translate(30px, -20px); opacity: 0; }
      }
      .dust-1 { animation: floatDust1 7s ease-in-out infinite; }
      .dust-2 { animation: floatDust2 9s ease-in-out infinite 2s; }
      .dust-3 { animation: floatDust1 11s ease-in-out infinite 4s; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <!-- Top Coordinates / Metadata -->
  <text x="425" y="32" class="fill-dim text-mono" font-size="9">R O K U B A N - M E &nbsp; · &nbsp; 第 六 駅 &nbsp; · &nbsp; 35°41′22″N 139°41′30″E</text>
  <line x1="280" y1="44" x2="570" y2="44" class="stroke-dim" stroke-dasharray="2 4" stroke-width="0.75"/>

  <!-- Far Sky Particulates -->
  <circle cx="360" cy="90" r="1" class="fill-main dust-1"/>
  <circle cx="490" cy="110" r="1.2" class="fill-main dust-2"/>
  <circle cx="300" cy="140" r="0.8" class="fill-main dust-3"/>
  <circle cx="550" cy="80" r="1" class="fill-main dust-1"/>
  <circle cx="430" cy="65" r="0.8" class="fill-main dust-2"/>

  <!-- Submerged Telegraph Poles (Perspective) -->
  <!-- Left Outer Pole -->
  <line x1="120" y1="120" x2="120" y2="230" class="stroke-main" stroke-width="1.2"/>
  <line x1="95" y1="140" x2="145" y2="140" class="stroke-main" stroke-width="1"/>
  <line x1="102" y1="160" x2="138" y2="160" class="stroke-main" stroke-width="0.8"/>
  <circle cx="102" cy="139" r="1.5" class="fill-main"/>
  <circle cx="138" cy="139" r="1.5" class="fill-main"/>

  <!-- Left Inner Pole -->
  <line x1="250" y1="155" x2="250" y2="230" class="stroke-dim" stroke-width="0.9"/>
  <line x1="232" y1="170" x2="268" y2="170" class="stroke-dim" stroke-width="0.8"/>
  <circle cx="235" cy="169" r="1" class="fill-dim"/>
  <circle cx="265" cy="169" r="1" class="fill-dim"/>

  <!-- Right Inner Pole -->
  <line x1="600" y1="155" x2="600" y2="230" class="stroke-dim" stroke-width="0.9"/>
  <line x1="582" y1="170" x2="618" y2="170" class="stroke-dim" stroke-width="0.8"/>
  <circle cx="585" cy="169" r="1" class="fill-dim"/>
  <circle cx="615" cy="169" r="1" class="fill-dim"/>

  <!-- Right Outer Pole -->
  <line x1="730" y1="120" x2="730" y2="230" class="stroke-main" stroke-width="1.2"/>
  <line x1="705" y1="140" x2="755" y2="140" class="stroke-main" stroke-width="1"/>
  <line x1="712" y1="160" x2="748" y2="160" class="stroke-main" stroke-width="0.8"/>
  <circle cx="712" cy="139" r="1.5" class="fill-main"/>
  <circle cx="748" cy="139" r="1.5" class="fill-main"/>

  <!-- Wires (Catenary Curves) -->
  <path d="M 0,115 Q 60,135 120,140" class="stroke-dim" stroke-width="0.75"/>
  <path d="M 120,140 Q 185,165 250,170" class="stroke-dim" stroke-width="0.6"/>
  <path d="M 250,170 Q 337,192 425,195" class="stroke-dim" stroke-width="0.5" stroke-dasharray="3 3"/>
  <path d="M 425,195 Q 513,192 600,170" class="stroke-dim" stroke-width="0.5" stroke-dasharray="3 3"/>
  <path d="M 600,170 Q 665,165 730,140" class="stroke-dim" stroke-width="0.6"/>
  <path d="M 730,140 Q 790,135 850,115" class="stroke-dim" stroke-width="0.75"/>

  <!-- Central Water Torii / Sea Station Gateway -->
  <!-- Top lintel curved ends -->
  <path d="M 370,110 Q 425,103 480,110" class="stroke-main" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="378" y1="122" x2="472" y2="122" class="stroke-main" stroke-width="1.5"/>
  <!-- Upright pillars -->
  <line x1="395" y1="110" x2="395" y2="230" class="stroke-main" stroke-width="1.8"/>
  <line x1="455" y1="110" x2="455" y2="230" class="stroke-main" stroke-width="1.8"/>
  <line x1="395" y1="172" x2="455" y2="172" class="stroke-dim" stroke-width="1"/>

  <!-- Central Suspended Lantern -->
  <line x1="425" y1="122" x2="425" y2="140" class="stroke-main" stroke-width="0.9"/>
  <!-- Outer halo ring -->
  <circle cx="425" cy="145" r="14" class="stroke-dim" stroke-width="0.5" stroke-dasharray="2 3"/>
  <!-- Breathing lantern core -->
  <circle cx="425" cy="145" r="7" class="fill-main lantern-glow"/>
  <circle cx="425" cy="145" r="3" class="fill-main" opacity="0.9"/>

  <!-- Horizon Line (Water Surface) -->
  <line x1="30" y1="230" x2="820" y2="230" class="stroke-main" stroke-width="1"/>

  <!-- Submerged Sea Railway Tracks (Perspective to Infinity) -->
  <!-- Vanishing Point at (425, 230) -->
  <!-- Left Rail -->
  <line x1="425" y1="230" x2="270" y2="340" class="stroke-main" stroke-width="1.5"/>
  <!-- Right Rail -->
  <line x1="425" y1="230" x2="580" y2="340" class="stroke-main" stroke-width="1.5"/>

  <!-- Railway Ties / Sleepers with perspective spacing -->
  <line x1="422" y1="234" x2="428" y2="234" class="stroke-dim" stroke-width="0.8"/>
  <line x1="418" y1="239" x2="432" y2="239" class="stroke-dim" stroke-width="0.8"/>
  <line x1="413" y1="246" x2="437" y2="246" class="stroke-dim" stroke-width="0.9"/>
  <line x1="406" y1="255" x2="444" y2="255" class="stroke-dim" stroke-width="1"/>
  <line x1="397" y1="267" x2="453" y2="267" class="stroke-dim" stroke-width="1"/>
  <line x1="384" y1="282" x2="466" y2="282" class="stroke-main" stroke-width="1.2"/>
  <line x1="368" y1="301" x2="482" y2="301" class="stroke-main" stroke-width="1.2"/>
  <line x1="346" y1="325" x2="504" y2="325" class="stroke-main" stroke-width="1.4"/>

  <!-- Drifting Water Ripples / Glass Reflections -->
  <g class="water-group">
    <!-- Gentle shallow wave strokes -->
    <path d="M 60,240 C 90,238 120,242 150,240" class="stroke-dim" stroke-width="0.75"/>
    <path d="M 210,248 C 240,246 270,250 300,248" class="stroke-dim" stroke-width="0.75"/>
    <path d="M 550,244 C 580,242 610,246 640,244" class="stroke-dim" stroke-width="0.75"/>
    <path d="M 700,238 C 730,236 760,240 790,238" class="stroke-dim" stroke-width="0.75"/>

    <path d="M 120,265 C 160,263 200,267 240,265" class="stroke-dim" stroke-width="0.9"/>
    <path d="M 610,270 C 650,268 690,272 730,270" class="stroke-dim" stroke-width="0.9"/>

    <path d="M 170,295 C 220,292 270,298 320,295" class="stroke-dim" stroke-width="1"/>
    <path d="M 530,298 C 580,295 630,301 680,298" class="stroke-dim" stroke-width="1"/>

    <!-- Lantern Water Reflection (Fading Shimmer) -->
    <ellipse cx="425" cy="245" rx="18" ry="2" class="stroke-dim" stroke-width="0.6" stroke-dasharray="3 3"/>
    <ellipse cx="425" cy="260" rx="14" ry="2.5" class="stroke-dim" stroke-width="0.7" stroke-dasharray="2 4"/>
    <ellipse cx="425" cy="280" rx="22" ry="3" class="stroke-dim" stroke-width="0.8" stroke-dasharray="4 4"/>
    <ellipse cx="425" cy="310" rx="30" ry="3.5" class="stroke-dim" stroke-width="0.9" stroke-dasharray="5 5"/>
  </g>

  <!-- Bottom Archival Status Marker -->
  <text x="425" y="348" class="fill-dim text-mono" font-size="8">E N T R O P Y : A C C U M U L A T I N G &nbsp; · &nbsp; T I D E : + 0 . 0 2 m &nbsp; · &nbsp; F R E Q U E N C Y : 0 . 0 0 H z</text>
</svg>
